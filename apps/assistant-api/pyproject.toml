[project]
name = "spb-assistant-api"
version = "0.3.6"
description = "中国邮政理赔助手显式模式分发与咨询 API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "pymysql>=1.1,<2",
  "rapidfuzz>=3.9,<4",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
spb-assistant-api = "spb_assistant_api.main:run"
spb-assistant-agent-demo = "spb_assistant_api.agent_demo:run"
spb-assistant-understanding-export = "spb_assistant_api.understanding_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spb_assistant_api"]
