[project]
name = "spb-assistant-api"
version = "0.3.2"
description = "中国邮政理赔助手显式模式分发与咨询 API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "pymysql>=1.1,<2",
  "rapidfuzz>=3.9,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
spb-assistant-api = "spb_assistant_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spb_assistant_api"]
