[project]
name = "spb-rag-api"
version = "0.2.0"
description = "国家邮政局政策知识库在线检索与问答 API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "pydantic-settings>=2.7,<3",
  "pymilvus>=2.6,<3",
  "sentence-transformers>=3,<6",
  "spb-contracts",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
spb-rag-api = "spb_rag_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spb_rag_api"]

[tool.uv.sources]
spb-contracts = { workspace = true }
