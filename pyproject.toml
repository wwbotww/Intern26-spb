[project]
name = "intern26-spb-workspace"
version = "0.2.0"
description = "国家邮政局政策知识库离线流水线与在线 RAG 服务工作区"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/offline-pipeline",
  "apps/rag-api",
  "apps/assistant-api",
  "eval",
  "packages/contracts",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[tool.pytest.ini_options]
testpaths = [
  "apps/offline-pipeline/tests",
  "apps/rag-api/tests",
  "apps/assistant-api/tests",
  "eval/tests",
  "packages/contracts/tests",
]
addopts = "-q"
