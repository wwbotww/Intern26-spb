[project]
name = "spb-eval"
version = "0.1.0"
description = "国家邮政局政策 RAG API 黑盒评估工具"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
]

[project.scripts]
spb-eval = "spb_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spb_eval"]
