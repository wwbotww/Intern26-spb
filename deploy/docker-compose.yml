services:
  chat-web:
    build:
      context: ../apps/chat-web
    image: intern26-spb-chat-web:0.1.0
    environment:
      CHAT_WEB_RAG_API_KEY: ${CHAT_WEB_RAG_API_KEY:-}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      rag-api:
        condition: service_healthy
    restart: unless-stopped

  rag-api:
    build:
      context: ..
      dockerfile: apps/rag-api/Dockerfile
    image: intern26-spb-rag-api:0.5.0
    env_file:
      - ../apps/rag-api/.env
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8080/health/live', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6g

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles:
      - monitoring
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus-data:
