location = /api/v2/agent/browser-session {
    if ($request_method != POST) { return 405; }
    include /tmp/agent-proxy.conf;
    proxy_pass http://assistant-api:8081/v2/agent/browser-session;
}
location = /api/v2/agent/capabilities {
    if ($request_method != GET) { return 405; }
    include /tmp/agent-proxy.conf;
    proxy_pass http://assistant-api:8081/v2/agent/capabilities;
}
location = /api/v2/agent/messages {
    if ($request_method != POST) { return 405; }
    include /tmp/agent-proxy.conf;
    proxy_pass http://assistant-api:8081/v2/agent/messages;
}
location ~ "^/api/v2/agent/conversations/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
    if ($request_method !~ "^(GET|DELETE)$") { return 405; }
    include /tmp/agent-proxy.conf;
    rewrite ^/api(/v2/agent/conversations/.*)$ $1 break;
    proxy_pass http://assistant-api:8081;
}
